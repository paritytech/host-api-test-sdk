name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # First gate on purpose: the unit suite needs no build and no browser, so
      # it is the fastest signal there is — and it carries the drift guards
      # (SSO session-blob length, the 24 wire variants, the schnorrkel vectors)
      # that nothing else in CI would catch.
      - name: Unit tests
        run: pnpm run test:unit

      - name: Build browser bundle
        run: pnpm run build:bundle

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Smoke test
        run: pnpm test

      - name: Verify pack
        run: pnpm pack && ls -lh *.tgz

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run integration tests
        run: pnpm run test:integration
